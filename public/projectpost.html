        <h1>review</h1>
        <form id="reviewForm">
            <label for="songname">song name:</label>
            <input type="text" id="songname" required>
            <br>

            <label for="albumname">album name:</label>

            <label for="artistname">artist name:</label>
            <input type="text" id="artistname" required>

            <label for="ratingnumb">rating(0-10):</label>
            <input type="number" id="ratingnumb" required>
            <br>

            <label for="description">give em an earful:</label>
            <input type="text" id="description">
            <br>
            <input id="submitbutton"  type="submit" value="review">
        </form>
